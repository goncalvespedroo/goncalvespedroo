name: Gerar cobrinha das contribuições

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Gerar animação das contribuições
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#1A2630&color_dots=#F3F1EC,#DDE4DB,#BAC8B8,#7A8B7B,#4E6755
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#E6D7BD&color_dots=#161B22,#273830,#3B5544,#5F7863,#97AA98

      - name: Publicar animação na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
